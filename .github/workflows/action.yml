name: CI and Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  DOCKER_REGISTRY: ghcr.io
  # `v1.2.3` on a tag push, `latest` on main
  IMAGE: ghcr.io/${{ github.repository_owner }}/s3-file-service:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
  RUST_TOOLCHAIN: 1.99.1

jobs:
  check:
    name: Format, Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --locked

  build_and_push:
    name: Build and Push Docker Image (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          PAT: ${{ secrets.PAT }}
          ACTOR: ${{ github.actor }}
        run: echo "$PAT" | docker login "$DOCKER_REGISTRY" -u "$ACTOR" --password-stdin

      # Pull requests only verify that the image builds.
      - name: Build Docker Image for ${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
          OUTPUT: ${{ github.event_name == 'pull_request' && '--output=type=cacheonly' || '--push' }}
        run: docker buildx build --platform "linux/$ARCH" --tag "$IMAGE-$ARCH" "$OUTPUT" .

  create_manifest:
    name: Create Multi-Architecture Manifest
    if: github.event_name != 'pull_request'
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        env:
          PAT: ${{ secrets.PAT }}
          ACTOR: ${{ github.actor }}
        run: echo "$PAT" | docker login "$DOCKER_REGISTRY" -u "$ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create and Push Manifest
        run: docker buildx imagetools create --tag "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
