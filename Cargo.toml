[package]
name = "s3-file-service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-multipart = "0.8.4"
actix-web = "4.15.0"
anyhow = "1.0.104"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.127.0"
aws-sdk-s3 = "1.149.0"
bytemuck = "1.25.2"
bytes = "1.12.1"
dotenv = "0.15.0"
futures = "0.3.34"
image = { version = "0.25.10", features = ["avif", "png", "webp"] }
ravif = "0.13.0"
rgb = "0.8.53"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webp = "0.3.1"
webp_encoder = "0.6.0"

[dev-dependencies]
wiremock = "0.6"
